# ─────────────────────────────────────────────────────────────
# wt status bar
#
#   ▏wt/rollup-stats ▏ 1 󰆍 Shell  2 󰚩 Claude  3 󰨞 VsCode …
#                          rollup-stats   CON-798  󰛳 8083/3003
#
# The active window is drawn as a solid coloured block; every
# other window is dim. Requires a Nerd Font for the glyphs —
# swap the glyphs in @wt_win_icon below if you'd rather not.
#
# The Api and Web icons turn green while something is listening
# on that worktree's port, so the bar doubles as a "did my dev
# server actually come up?" indicator.
#
# Sourced from ~/.tmux.conf:
#   source-file ~/.config/wt/tmux-statusbar.conf
# ─────────────────────────────────────────────────────────────

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=colour235,fg=colour248"

set -g status-left-length 10
set -g status-right-length 120

# Windows are numbered from 1 by `wt`'s layout ordering.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Left: prefix indicator only ──────────────────────────────
# The session/worktree name lives on the right, so the left is
# just a lamp that lights up while the prefix key is armed.
set -g status-left "#{?client_prefix,#[fg=colour232#,bg=colour215#,bold]  ,#[fg=colour238] · }"

# ── Window label: icon + capitalised name ────────────────────
# Icon and text are separate chains so the icon can be coloured
# independently of the name. Both are held in user options so
# the two window formats share one copy. Unknown windows fall
# through to a generic icon and their raw tmux name.
set -g @wt_win_icon "#{?#{==:#{window_name},shell},󰆍,#{?#{==:#{window_name},claude},󰚩,#{?#{==:#{window_name},vscode},󰨞,#{?#{==:#{window_name},api},󰒋,#{?#{==:#{window_name},web},󰖟,#{?#{==:#{window_name},status},󰓅,#{?#{==:#{window_name},logs},󰈙,#{?#{==:#{window_name},debug},󰃤,󰖯}}}}}}}}"
set -g @wt_win_text "#{?#{==:#{window_name},shell},Shell,#{?#{==:#{window_name},claude},Claude,#{?#{==:#{window_name},vscode},VsCode,#{?#{==:#{window_name},api},Api,#{?#{==:#{window_name},web},Web,#{?#{==:#{window_name},status},Status,#{?#{==:#{window_name},logs},Logs,#{?#{==:#{window_name},debug},Debug,#{window_name}}}}}}}}}"

# Flags appended to either state: zoomed pane, bell/activity.
set -g @wt_win_flags "#{?window_zoomed_flag, ,}#{?window_bell_flag, ,}"

# ── Liveness ─────────────────────────────────────────────────
# wt-tmux-status sets @wt_srv_up on the api and web windows each
# status refresh (1 = something is listening on that port). It's
# a *window* option, so every other window resolves it to empty.
set -g @wt_win_up "#{==:#{@wt_srv_up},1}"

# Green when that window's server is listening, otherwise the
# normal dim/accent colour.
set -g @wt_icon_fg "#{?#{E:@wt_win_up},colour114,colour245}"
set -g @wt_block   "#{?#{E:@wt_win_up},colour114,colour39}"

set -g window-status-separator ""

# Inactive window — dim, no background; icon turns green when up.
set -g window-status-format "#[fg=colour242,bg=colour235] #I #[fg=#{E:@wt_icon_fg}]#{E:@wt_win_icon}#[fg=colour245] #{E:@wt_win_text}#{E:@wt_win_flags} "

# Active window — solid block, this is the "you are here" marker.
# The block itself goes green when that window's server is up
# (a green icon on the blue block would be unreadable).
set -g window-status-current-format "#[fg=#{E:@wt_block}]#[bg=colour235]#[fg=colour232]#[bg=#{E:@wt_block}]#[bold] #I #{E:@wt_win_icon} #{E:@wt_win_text}#{E:@wt_win_flags} #[fg=#{E:@wt_block}]#[bg=colour235]#[nobold]"

# Window with unseen activity.
set -g window-status-activity-style "fg=colour215,bg=colour235"
set -g window-status-bell-style "fg=colour203,bg=colour235,bold"

# ── Right: worktree, branch, ports ───────────────────────────
set -g status-right "#(~/.local/bin/wt-tmux-status '#{session_name}' '#{pane_current_path}')"

# ── Supporting styles ────────────────────────────────────────
set -g message-style "bg=colour39,fg=colour232"
set -g mode-style "bg=colour39,fg=colour232"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"
